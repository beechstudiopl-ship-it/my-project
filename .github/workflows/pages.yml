name: Deploy działajmy.online to GitHub Pages

on:
  push:
    branches: [claude/install-claude-seo-plugin-jnn8w7] # repo's default branch — there is no "main" here
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files only
        run: |
          mkdir -p _site
          cp index.html manifest.html seo90.html nie-mam-dostepu.html dla-kogo.html zamowienia-gastronomia.html demo-gastro.html strona-trener-fizjoterapeuta.html demo-trener.html trener-1.avif trener-2.avif trener-3.avif strona-psycholog-psychoterapia.html demo-psycholog.html demo-psycholog-o-nas.html demo-psycholog-metodyka.html demo-psycholog-zalozenia.html demo-psycholog-kontakt.html demo-psycholog-artykul.html polityka-prywatnosci.html kontakt.html konsultacja.html silny-lokalnie.html og-image.png sitemap.xml robots.txt CNAME demo-strefa-balansu.html demo-strefa-balansu-oferta.html demo-strefa-balansu-portfolio.html demo-strefa-balansu-kontakt.html strefa-balansu-domek-na-drzewie-1.jpg strefa-balansu-domek-na-drzewie-2.jpg strefa-balansu-domek-na-drzewie-3.jpg strefa-balansu-domek-na-drzewie-4.jpg strefa-balansu-domek-na-drzewie-5.jpg strefa-balansu-pro-amus-1.jpg strefa-balansu-pro-amus-2.jpg strefa-balansu-pro-amus-3.jpg strefa-balansu-pro-amus-4.jpg strefa-balansu-pro-amus-5.jpg strefa-balansu-realizacja-nowa-1.jpg strefa-balansu-realizacja-nowa-2.jpg strefa-balansu-realizacja-nowa-3.jpg strefa-balansu-realizacja-nowa-4.jpg strefa-balansu-realizacja-nowa-5.jpg strefa-balansu-realizacja-nowa-6.jpg strefa-balansu-realizacja-nowa-7.jpg strefa-balansu-realizacja-nowa-8.jpg strefa-balansu-realizacja-nowa-9.jpg strefa-balansu-marcin-banat.png strefa-balansu-portfolio.pdf strefa-balansu-galeria-1.jpg strefa-balansu-galeria-2.jpg strefa-balansu-galeria-3.jpg strefa-balansu-galeria-4.jpg strefa-balansu-galeria-5.jpg strefa-balansu-galeria-6.jpg strefa-balansu-galeria-7.jpg strefa-balansu-galeria-8.jpg strefa-balansu-galeria-9.jpg strefa-balansu-galeria-10.jpg strefa-balansu-galeria-11.jpg strefa-balansu-galeria-12.jpg strefa-balansu-galeria-13.jpg strefa-balansu-galeria-14.jpg strefa-balansu-galeria-15.jpg strefa-balansu-galeria-16.jpg strefa-balansu-galeria-17.jpg strefa-balansu-galeria-18.jpg strefa-balansu-galeria-19.jpg strefa-balansu-galeria-20.jpg strefa-balansu-galeria-21.jpg strefa-balansu-logo-white.svg _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
