<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Grafika do mailingu · działajmy.online</title>
<!-- Źródło grafiki JPG do mailingu (600 px szerokości).
     Po zmianach wygeneruj JPG ponownie:
     node mailing/render.js -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--paper:#F4F2EC;--ink:#14171B;--ink-2:#4A525C;--blue:#1B4BFF;--hi:#F5E33D}
  body{width:600px;background:var(--paper);font-family:"Source Sans 3",Helvetica,Arial,sans-serif;color:var(--ink)}
  #ad{width:600px;height:700px;position:relative;overflow:hidden;background:var(--paper);padding:44px 44px 0}
  .logo{font-family:Archivo,Helvetica,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.5px}
  .logo span{color:var(--blue)}
  .kicker{margin-top:46px;display:inline-block;background:var(--hi);padding:6px 12px;
    font-family:Archivo,Helvetica,sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
  h1{margin-top:22px;font-family:Archivo,Helvetica,sans-serif;font-weight:900;font-size:54px;line-height:1.02;letter-spacing:-1.5px}
  h1 em{font-style:normal;color:var(--blue)}
  .lead{margin-top:22px;font-size:21px;line-height:1.45;color:var(--ink-2);max-width:470px}
  .lead b{color:var(--ink)}
  .price{position:absolute;right:40px;top:36px;width:136px;height:136px;border-radius:50%;
    background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(8deg);font-family:Archivo,Helvetica,sans-serif;text-align:center}
  .price small{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .price strong{font-size:34px;font-weight:900;line-height:1;margin-top:4px}
  .steps{margin-top:40px;display:flex;gap:12px}
  .step{flex:1;background:#fff;border:1px solid rgba(20,23,27,.14);padding:14px 14px 16px}
  .step i{font-style:normal;font-family:Archivo,Helvetica,sans-serif;font-weight:800;color:var(--blue);font-size:14px}
  .step p{margin-top:4px;font-weight:700;font-size:17px;line-height:1.25}
  .cta{position:absolute;left:0;right:0;bottom:0;height:96px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:space-between;padding:0 44px}
  .cta .btn{background:var(--hi);color:var(--ink);font-family:Archivo,Helvetica,sans-serif;font-weight:800;
    font-size:20px;padding:14px 22px}
  .cta .url{font-size:17px;opacity:.8}
</style>
</head>
<body>
<div id="ad">
  <div class="logo">działajmy<span>.</span>online</div>

  <div class="kicker">Dla lokalnych firm</div>
  <h1>Strona www,<br>która <em>działa</em>.<br>Bez przepłacania.</h1>
  <p class="lead">Gotowa w <b>7–14 dni</b>. Płacisz dopiero,<br>gdy zobaczysz podgląd.</p>

  <div class="price"><small>już od</small><strong>1000 zł</strong></div>

  <div class="steps">
    <div class="step"><i>01</i><p>Opisz, czym się zajmujesz</p></div>
    <div class="step"><i>02</i><p>Dobieram styl do branży</p></div>
    <div class="step"><i>03</i><p>Poprawki i strona live</p></div>
  </div>

  <div class="cta">
    <span class="btn">Zobacz demo za darmo →</span>
    <span class="url">dzialajmy.online</span>
  </div>
</div>
</body>
</html>
